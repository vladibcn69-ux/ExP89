# ExP 89 - Nginx reverse proxy con terminacion TLS
# Rutas /etc/nginx/certs/... = rutas INTERNAS del contenedor (montadas en solo lectura desde /etc/ssl del host)

# Formato de log para correlacionar con Suricata (hora ISO 8601 con zona, cliente:puerto, peticion, estado, TLS)
log_format mf0489 '$time_iso8601 client=$remote_addr:$remote_port '
                  'request="$request" status=$status '
                  'tls=$ssl_protocol cipher=$ssl_cipher';
# access_log se declara dentro de cada server: asi sustituye al access_log "main" de nginx.conf
# (a nivel http se sumaria y cada peticion saldria dos veces). En la imagen oficial /var/log/nginx/access.log es un enlace a stdout.

server {
    listen 80;
    server_name portal.proyecto.test;
    access_log /var/log/nginx/access.log mf0489;

    # Redireccion permanente a HTTPS conservando host y ruta
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portal.proyecto.test;
    access_log /var/log/nginx/access.log mf0489;

    ssl_certificate     /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Ajuste de TLS (Fase 4): en TLS 1.2 solo ECDHE (forward secrecy) con AES-GCM o ChaCha20-Poly1305.
    # Las suites de TLS 1.3 no se ven afectadas por esta directiva. HSTS no se activa (queda como recomendacion).
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64m;

    location / {
        # "wordpress" = nombre del servicio en la red Docker exp89_front, puerto HTTP interno 80
        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
